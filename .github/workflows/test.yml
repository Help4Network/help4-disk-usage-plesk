name: Linux and Windows
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scanner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
      - run: python scripts/package_whmcs.py
  php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, pdo_sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: php tests/lint.php
      - run: php tests/security.php
      - run: php tests/policy.php
      - run: php tests/releases.php
      - run: php tests/controllers.php
      - run: php tests/scheduler.php
      - run: php tests/runtime.php
      - run: php tests/process.php
      - run: php tests/permissions.php
      - run: php tests/whmcs_scope.php
      - run: php tests/whmcs_report.php
      - run: php tests/whmcs_transport.php
      - run: php tests/whmcs_native.php
      - run: php tests/lifecycle.php
      - run: php tests/executable_preflight.php

  windows-acl:
    name: Windows ACL preflight (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Adversarial descriptors and real NTFS metadata (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: '& ./tests/windows-acl.ps1'
      - name: Adversarial descriptors and real NTFS metadata (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: '& ./tests/windows-acl.ps1'

  linux-distros:
    name: Linux runtime (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: 'almalinux:8', python: python3.11}
          - {image: 'almalinux:9', python: python3.11}
          - {image: 'almalinux:10', python: python3}
          - {image: 'ubuntu:22.04', python: python3}
          - {image: 'ubuntu:24.04', python: python3}
          - {image: 'ubuntu:26.04', python: python3}
          - {image: 'debian:12', python: python3}
          - {image: 'debian:13', python: python3}
    container: ${{ matrix.image }}
    steps:
      - name: Install test runtime only
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y python3 git libstdc++6
          else
            dnf install -y '${{ matrix.python }}' git libstdc++
          fi
      - uses: actions/checkout@v4
      - name: Runtime and descriptor collector regressions
        run: |
          '${{ matrix.python }}' -I -S extension/plib/collector/runtime.py
          '${{ matrix.python }}' -m unittest discover -s tests -v
          '${{ matrix.python }}' scripts/package.py

  macos-developer:
    name: macOS developer regressions (not a native Plesk target)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, pdo_sqlite
      - name: Portable collector and unsupported-native-runtime fixtures
        run: python -m unittest discover -s tests -v
      - name: PHP control, entitlement and report regressions
        run: |
          php tests/lint.php
          php tests/security.php
          php tests/policy.php
          php tests/releases.php
          php tests/controllers.php
          php tests/scheduler.php
          php tests/runtime.php
          php tests/process.php
          php tests/permissions.php
          php tests/whmcs_scope.php
          php tests/whmcs_report.php
          php tests/whmcs_transport.php
          php tests/whmcs_native.php
          php tests/lifecycle.php
          php tests/executable_preflight.php
      - name: Build portable preview artifact
        run: |
          python scripts/package.py
          python scripts/package_whmcs.py
